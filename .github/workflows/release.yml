name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  binaries:
    name: Build binary (${{ matrix.os }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            arch: aarch64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      VERSION: ${{ github.ref_name }} # e.g. v1.2.3
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.3"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install versioning plugin
        run: poetry self add "poetry-dynamic-versioning[plugin]"

      - name: Install dependencies
        run: poetry install

      - name: Show tagged version
        run: poetry run python -c "import importlib.metadata as m; print('building version:', m.version('rtwi'))"

      - name: Build standalone binary (PyInstaller)
        run: poetry run pyinstaller --noconfirm --clean rtwi.spec
      - name: Package tarball
        run: |
          cd dist/rtwi
          tar -czf ../rtwi-${{ env.VERSION }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz .
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rtwi-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/rtwi-${{ env.VERSION }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    runs-on: ubuntu-latest
    needs: binaries
    timeout-minutes: 10
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: rtwi-*
      - name: Flatten downloads into artifacts/
        run: |
          mkdir -p artifacts
          find . -name 'rtwi-*.tar.gz' -type f -exec cp -n {} artifacts/ \;
      - name: Generate checksums
        working-directory: artifacts
        run: |
          shasum -a 256 rtwi-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: rtwi ${{ env.VERSION }}
          draft: true
          generate_release_notes: true
          files: |
            artifacts/rtwi-*.tar.gz
            artifacts/SHA256SUMS
